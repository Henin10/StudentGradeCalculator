<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Grade Calculator Management System</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-wrapper {
            width: 100%;
            max-width: 460px;
            margin-top: 30px;
            margin-bottom: 30px;
        }

        .brand-icon-large {
            width: 64px;
            height: 64px;
            margin: 0 auto 12px;
            background: #f0f2fe;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
            box-shadow: 0 4px 14px rgba(102, 126, 234, 0.2);
        }

        .brand-icon-large svg {
            width: 34px;
            height: 34px;
            fill: currentColor;
        }

        .demo-box {
            margin-top: 18px;
            padding: 14px;
            background: #f7f8ff;
            border: 1px dashed #c8d0fb;
            border-radius: 10px;
            font-size: 13px;
        }

        .demo-box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .demo-box-title {
            font-weight: bold;
            color: #4b52b5;
        }

        .toggle-password-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #888888;
        }

        .input-relative {
            position: relative;
        }

        .input-relative input {
            padding-right: 44px;
        }
    </style>
</head>

<body>

    <div class="login-wrapper">

        <div class="card">

            <!-- BRAND HEADER -->
            <div style="text-align: center; margin-bottom: 24px;">
                <div class="brand-icon-large">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18L12 21L19 17.18V13.18L12 17L5 13.18Z" />
                    </svg>
                </div>
                <h1 style="font-size: 24px; color: #2d3748; margin-bottom: 6px;">Student Grade Calculator</h1>
                <p style="font-size: 14px; color: #718096;">Phase 4: Server-Side Authentication</p>
            </div>

            <h2 class="section-accent-title">Sign In</h2>

            <!-- ALERT MESSAGE -->
            <div id="alertBox" class="alert"></div>

            <!-- LOGIN FORM (Supports Servlet POST & JS Validation) -->
            <form id="loginForm" action="login" method="POST" onsubmit="handleLoginSubmit(event)">

                <div class="form-group">
                    <label for="username">Username or Student ID *</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="e.g. rahul101 or MCA101"
                        autocomplete="username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <div class="input-relative">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter password (min 8 chars, 1 digit)"
                            autocomplete="current-password"
                            required>
                        <button
                            type="button"
                            class="toggle-password-btn"
                            onclick="togglePasswordVisibility()"
                            title="Show/Hide Password">
                            👁️
                        </button>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 13px;">
                    <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; margin: 0; font-weight: normal;">
                        <input type="checkbox" id="rememberMe" style="width: auto; margin: 0;"> Remember me
                    </label>
                    <a href="javascript:void(0)" onclick="showForgotInfo()" style="color: #667eea; text-decoration: none; font-weight: 600;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%;">
                    Sign In to Dashboard &rarr;
                </button>

            </form>

            <!-- REGISTRATION PROMPT (Phase 3 Requirement) -->
            <div style="text-align: center; margin-top: 18px; font-size: 14px;">
                <span style="color: #718096;">New Student?</span>
                <a href="register.html" style="color: #667eea; text-decoration: none; font-weight: bold; margin-left: 6px;">
                    Create Account / Register &rarr;
                </a>
            </div>

            <!-- DEMO ACCOUNT HELPER -->
            <div class="demo-box">
                <div class="demo-box-header">
                    <span class="demo-box-title">Demo User Account</span>
                    <button type="button" class="btn btn-primary btn-sm" onclick="fillDemo()">Quick Fill</button>
                </div>
                <div style="color: #666; line-height: 1.5;">
                    Username: <code style="background: #eaedff; padding: 2px 6px; border-radius: 4px;">rahul101</code> &nbsp;|&nbsp;
                    Password: <code style="background: #eaedff; padding: 2px 6px; border-radius: 4px;">Rahul@123</code><br>
                    <small style="color: #888;">Student: Rahul Kumar (ID: MCA101)</small>
                </div>
            </div>

        </div>

        <div class="footer">
            Student Grade Calculator Management System
        </div>

    </div>

    <script src="script.js?v=20261028-2"></script>
    <script>
        function togglePasswordVisibility() {
            const passInput = document.getElementById("password");
            passInput.type = (passInput.type === "password") ? "text" : "password";
        }

        function fillDemo() {
            document.getElementById("username").value = "rahul101";
            document.getElementById("password").value = "Rahul@123";
            hideAlert();
        }

        function showAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById("alertBox");
            alertBox.className = "alert " + (isSuccess ? "alert-success" : "alert-error");
            alertBox.textContent = msg;
            alertBox.style.display = "block";
        }

        function hideAlert() {
            document.getElementById("alertBox").style.display = "none";
        }

        function showForgotInfo() {
            alert("Default Credentials:\n\nUsername: rahul101\nPassword: Rahul@123\nStudent ID: MCA101");
        }

        // Phase 3 JavaScript validation and form submission flow
        async function handleLoginSubmit(event) {
            event.preventDefault();
            hideAlert();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const rememberMe = document.getElementById("rememberMe").checked;

            // Client-side checks improve feedback; server-side validation remains authoritative.
            if (username.length < 3) {
                showAlert("Enter a username or Student ID with at least 3 characters.");
                return;
            }

            if (password.length < 8) {
                showAlert("Password must contain at least 8 characters.");
                return;
            }

            if (!/\d/.test(password)) {
                showAlert("Password must contain at least one numeric digit (0-9).");
                return;
            }

            const formData = new URLSearchParams();
            formData.append("username", username);
            formData.append("password", password);

            let response;
            try {
                response = await fetch("login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                        "X-Requested-With": "XMLHttpRequest"
                    },
                    body: formData.toString()
                });
            } catch (networkError) {
                showAlert("Unable to reach the application server. Start the Java server and try again.");
                return;
            }

            let data;
            try {
                data = await response.json();
            } catch (invalidResponse) {
                showAlert("The server returned an invalid response. Please try again.");
                return;
            }

            if (!response.ok || !data.success || !data.user) {
                showAlert(data.message || "Authentication failed. Check your credentials and try again.");
                return;
            }

            setCurrentUser(data.user);
            if (rememberMe) {
                localStorage.setItem("gradeCalc_rememberedUsername", username);
            } else {
                localStorage.removeItem("gradeCalc_rememberedUsername");
            }
            document.getElementById("submitBtn").textContent = "Redirecting...";
            document.getElementById("submitBtn").disabled = true;
            window.location.href = data.redirect || "dashboard.jsp";
        }

        // Auto-fill a remembered username and check query parameters.
        window.addEventListener("DOMContentLoaded", () => {
            const savedUsername = localStorage.getItem("gradeCalc_rememberedUsername");
            if (savedUsername) {
                document.getElementById("username").value = savedUsername;
                document.getElementById("rememberMe").checked = true;
            }

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get("registered") === "true") {
                showAlert("Account created successfully! Please sign in with your credentials.", true);
            } else if (urlParams.get("loggedOut") === "true") {
                showAlert("You have been signed out successfully.", true);
            } else if (urlParams.get("error")) {
                showAlert(urlParams.get("error"), false);
            }
        });
    </script>

</body>

</html>
